<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 185" width="100%" height="100%" fill="none">
  <defs>
    <pattern id="hudCommsGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#00e5ff" stroke-width="0.75" stroke-opacity="0.06" />
    </pattern>

    <linearGradient id="hudCommsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b101d" />
      <stop offset="50%" stop-color="#070a12" />
      <stop offset="100%" stop-color="#0e1526" />
    </linearGradient>

    <linearGradient id="orangeBarCommsFull" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6b00" stop-opacity="0" />
      <stop offset="25%" stop-color="#ff7700" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#ff7700" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ff6b00" stop-opacity="0" />
    </linearGradient>

    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .beacon { animation: pulse 2s infinite ease-in-out; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    </style>
  </defs>

  <!-- Chassis -->
  <rect width="920" height="185" rx="8" fill="url(#hudCommsGrad)" stroke="#00e5ff" stroke-width="1.3" stroke-opacity="0.28" />
  <rect x="2" y="2" width="916" height="181" rx="6" fill="url(#hudCommsGrid)" />

  <!-- Corner Brackets -->
  <path d="M 12 34 L 12 12 L 34 12" fill="none" stroke="#00e5ff" stroke-width="3" stroke-linecap="square" />
  <path d="M 886 12 L 908 12 L 908 34" fill="none" stroke="#00e5ff" stroke-width="3" stroke-linecap="square" />
  <path d="M 12 151 L 12 173 L 34 173" fill="none" stroke="#00e5ff" stroke-width="3" stroke-linecap="square" />
  <path d="M 886 173 L 908 173 L 908 151" fill="none" stroke="#00e5ff" stroke-width="3" stroke-linecap="square" />

  <!-- Header -->
  <g transform="translate(32, 34)">
    <circle cx="5" cy="5" r="4.5" fill="#10b981" />
    <circle cx="5" cy="5" r="8" fill="#10b981" fill-opacity="0.25" class="beacon" />
    <text x="22" y="9" class="mono" font-size="14" font-weight="800" fill="#f8fafc" letter-spacing="0.08em">// 04. SECURE TRANSMISSION FREQUENCIES</text>
    <text x="856" y="9" class="mono" font-size="12" font-weight="600" text-anchor="end" fill="#10b981">CHANNELS: ACTIVE // 24/7</text>
  </g>

  <line x1="32" y1="52" x2="888" y2="52" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.2" />

  <!-- Channel 1: Portfolio -->
  <g transform="translate(32, 68)">
    <rect width="272" height="78" rx="4" fill="#0e1526" stroke="#00e5ff" stroke-width="1.2" stroke-opacity="0.35" />
    <text x="16" y="24" class="mono" font-size="11" font-weight="800" fill="#00e5ff" letter-spacing="0.06em">PORTFOLIO STATION</text>
    <text x="16" y="47" class="mono" font-size="14.5" font-weight="800" fill="#f8fafc">marcelopirro.vercel.app</text>
    <text x="16" y="66" class="sans" font-size="11" fill="#94a3b8">Interactive Portfolio &amp; Live Demos</text>
  </g>

  <!-- Channel 2: LinkedIn -->
  <g transform="translate(324, 68)">
    <rect width="272" height="78" rx="4" fill="#0e1526" stroke="#ff7700" stroke-width="1.2" stroke-opacity="0.4" />
    <text x="16" y="24" class="mono" font-size="11" font-weight="800" fill="#ff9933" letter-spacing="0.06em">LINKEDIN DISPATCH</text>
    <text x="16" y="47" class="mono" font-size="14.5" font-weight="800" fill="#f8fafc">/in/marcelopirro</text>
    <text x="16" y="66" class="sans" font-size="11" fill="#94a3b8">Professional Network &amp; Career</text>
  </g>

  <!-- Channel 3: Email -->
  <g transform="translate(616, 68)">
    <rect width="272" height="78" rx="4" fill="#0e1526" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.15" />
    <text x="16" y="24" class="mono" font-size="11" font-weight="800" fill="#cbd5e1" letter-spacing="0.06em">DIRECT COMMS</text>
    <text x="16" y="47" class="mono" font-size="14.5" font-weight="800" fill="#f8fafc">marcelopirro@outlook.com</text>
    <text x="16" y="66" class="sans" font-size="11" fill="#94a3b8">Engineering Inquiries &amp; Comms</text>
  </g>

  <!-- Bottom Accent Line -->
  <path d="M 32 160 L 888 160" stroke="url(#orangeBarCommsFull)" stroke-width="2.5" stroke-linecap="round" />
</svg>
