<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 230" width="100%" height="100%" fill="none">
  <defs>
    <pattern id="hudGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#00e5ff" stroke-width="0.75" stroke-opacity="0.07" />
    </pattern>

    <linearGradient id="hudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b101d" />
      <stop offset="50%" stop-color="#070a12" />
      <stop offset="100%" stop-color="#0e1526" />
    </linearGradient>

    <linearGradient id="orangeBarHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6b00" stop-opacity="0" />
      <stop offset="25%" stop-color="#ff7700" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#ff7700" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ff6b00" stop-opacity="0" />
    </linearGradient>

    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .beacon { animation: pulse 2s infinite ease-in-out; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    </style>
  </defs>

  <!-- Chassis Background -->
  <rect width="920" height="230" rx="8" fill="url(#hudGrad)" stroke="#00e5ff" stroke-width="1.4" stroke-opacity="0.3" />
  <rect x="2" y="2" width="916" height="226" rx="6" fill="url(#hudGrid)" />

  <!-- Mecha Corner Brackets -->
  <path d="M 12 36 L 12 12 L 36 12" fill="none" stroke="#00e5ff" stroke-width="3" stroke-linecap="square" />
  <path d="M 884 12 L 908 12 L 908 36" fill="none" stroke="#00e5ff" stroke-width="3" stroke-linecap="square" />
  <path d="M 12 194 L 12 218 L 36 218" fill="none" stroke="#00e5ff" stroke-width="3" stroke-linecap="square" />
  <path d="M 884 218 L 908 218 L 908 194" fill="none" stroke="#00e5ff" stroke-width="3" stroke-linecap="square" />

  <!-- Top Status Telemetry -->
  <g transform="translate(32, 34)">
    <circle cx="5" cy="5" r="4.5" fill="#10b981" />
    <circle cx="5" cy="5" r="8.5" fill="#10b981" fill-opacity="0.3" class="beacon" />
    <text x="22" y="9" class="mono" font-size="13" font-weight="700" fill="#10b981" letter-spacing="0.08em">STATUS: ONLINE // ALL SYSTEMS NOMINAL</text>
    <text x="856" y="9" class="mono" font-size="12" font-weight="600" text-anchor="end" fill="#00e5ff" letter-spacing="0.06em">CALLSIGN: PIRRO // SECTOR: SÃO PAULO, BR</text>
  </g>

  <!-- Divider -->
  <line x1="32" y1="50" x2="888" y2="50" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.25" />

  <!-- Callsign (Big & Bold) -->
  <text x="460" y="106" text-anchor="middle" class="mono" font-size="44" font-weight="800" fill="#f8fafc" letter-spacing="0.14em">MARCELO PIRRO</text>

  <!-- Role Badge -->
  <g transform="translate(460, 142)">
    <rect x="-310" y="-18" width="620" height="34" rx="4" fill="#0e1526" stroke="#ff7700" stroke-width="1.4" stroke-opacity="0.8" />
    <circle cx="-290" cy="-1" r="4" fill="#ff7700" />
    <text x="0" y="5" text-anchor="middle" class="mono" font-size="14.5" font-weight="800" fill="#ff9933" letter-spacing="0.1em">
      BACKEND ENGINEER // HIGH-AVAILABILITY &amp; DISTRIBUTED SYSTEMS
    </text>
  </g>

  <!-- Mission Chips Row -->
  <g transform="translate(460, 188)">
    <!-- Conexão Tech -->
    <rect x="-400" y="-12" width="180" height="26" rx="3" fill="#152038" stroke="#00e5ff" stroke-width="1.2" stroke-opacity="0.5" />
    <text x="-310" y="5" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#00e5ff">CONEXÃO TECH (ITAÚ)</text>

    <!-- UFSCar Alumni -->
    <rect x="-205" y="-12" width="145" height="26" rx="3" fill="#152038" stroke="#ffffff" stroke-width="1" stroke-opacity="0.2" />
    <text x="-132" y="5" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#cbd5e1">B.S. CS // UFSCAR</text>

    <!-- Core Stack -->
    <rect x="-45" y="-12" width="220" height="26" rx="3" fill="#152038" stroke="#ff7700" stroke-width="1" stroke-opacity="0.4" />
    <text x="65" y="5" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#ff9933">JAVA • SPRING • KAFKA</text>

    <!-- AWS Certified -->
    <rect x="190" y="-12" width="210" height="26" rx="3" fill="#ff7700" fill-opacity="0.14" stroke="#ff7700" stroke-width="1.2" stroke-opacity="0.8" />
    <circle cx="204" cy="1" r="3.5" fill="#ff7700" />
    <text x="300" y="5" text-anchor="middle" class="mono" font-size="11.5" font-weight="800" fill="#ffaa44">AWS CERTIFIED (CLF-C02)</text>
  </g>

  <!-- Bottom Glowing Accent Line -->
  <path d="M 32 216 L 888 216" stroke="url(#orangeBarHeader)" stroke-width="3" stroke-linecap="round" />
</svg>
