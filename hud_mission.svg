<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 310" width="100%" height="100%" fill="none">
  <defs>
    <pattern id="hudMissionGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#00e5ff" stroke-width="0.75" stroke-opacity="0.06" />
    </pattern>

    <linearGradient id="hudMissionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b101d" />
      <stop offset="50%" stop-color="#070a12" />
      <stop offset="100%" stop-color="#0e1526" />
    </linearGradient>

    <linearGradient id="orangeBarMission" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6b00" stop-opacity="0" />
      <stop offset="25%" stop-color="#ff7700" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#ff7700" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ff6b00" stop-opacity="0" />
    </linearGradient>

    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .beacon { animation: pulse 2s infinite ease-in-out; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    </style>
  </defs>

  <!-- Chassis -->
  <rect width="920" height="310" rx="8" fill="url(#hudMissionGrad)" stroke="#00e5ff" stroke-width="1.3" stroke-opacity="0.28" />
  <rect x="2" y="2" width="916" height="306" rx="6" fill="url(#hudMissionGrid)" />

  <!-- Corner Brackets -->
  <path d="M 12 36 L 12 12 L 36 12" fill="none" stroke="#00e5ff" stroke-width="3" stroke-linecap="square" />
  <path d="M 884 12 L 908 12 L 908 36" fill="none" stroke="#00e5ff" stroke-width="3" stroke-linecap="square" />
  <path d="M 12 274 L 12 298 L 36 298" fill="none" stroke="#00e5ff" stroke-width="3" stroke-linecap="square" />
  <path d="M 884 298 L 908 298 L 908 274" fill="none" stroke="#00e5ff" stroke-width="3" stroke-linecap="square" />

  <!-- Header -->
  <g transform="translate(32, 34)">
    <circle cx="5" cy="5" r="4.5" fill="#ff7700" />
    <circle cx="5" cy="5" r="8" fill="#ff7700" fill-opacity="0.25" class="beacon" />
    <text x="22" y="9" class="mono" font-size="14" font-weight="800" fill="#f8fafc" letter-spacing="0.08em">// 01. ACTIVE MISSIONS &amp; FIELD OPERATIONS</text>
    <text x="856" y="9" class="mono" font-size="12" font-weight="600" text-anchor="end" fill="#00e5ff">CLEARANCE: LEVEL-01</text>
  </g>

  <line x1="32" y1="52" x2="888" y2="52" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.2" />

  <!-- Bento 1: BIG WIDE CARD ON TOP (Conexão Tech / Itaú) -->
  <g transform="translate(32, 66)">
    <rect width="856" height="95" rx="5" fill="#0e1526" stroke="#00e5ff" stroke-width="1.2" stroke-opacity="0.4" />
    <!-- Tag -->
    <rect x="16" y="14" width="165" height="22" rx="3" fill="#00e5ff" fill-opacity="0.14" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.7" />
    <text x="98" y="29" class="mono" font-size="10.5" font-weight="800" fill="#00e5ff" text-anchor="middle">ACTIVE DEPLOYMENT</text>
    
    <!-- Title -->
    <text x="195" y="30" class="mono" font-size="15" font-weight="800" fill="#f8fafc">CONEXÃO TECH (ITAÚ GROUP) // BACKEND SOFTWARE ENGINEER</text>
    
    <!-- Details -->
    <text x="16" y="58" class="mono" font-size="13" font-weight="700" fill="#ff9933">
      MISSION: Mission-Critical Payment Processing &amp; High-Volume Financial Microservices
    </text>
    <text x="16" y="78" class="mono" font-size="12" fill="#94a3b8">
      STACK: Java 21 • Spring Boot • Apache Kafka • Microservices &amp; Strict Financial SLAs
    </text>
  </g>

  <!-- Bento 2: BOTTOM LEFT (Embraer Automation) -->
  <g transform="translate(32, 172)">
    <rect width="418" height="105" rx="5" fill="#0e1526" stroke="#ff7700" stroke-width="1.2" stroke-opacity="0.4" />
    <!-- Tag -->
    <rect x="14" y="12" width="160" height="22" rx="3" fill="#ff7700" fill-opacity="0.14" stroke="#ff7700" stroke-width="1" stroke-opacity="0.7" />
    <text x="94" y="27" class="mono" font-size="10.5" font-weight="800" fill="#ff9933" text-anchor="middle">ENTERPRISE IMPACT</text>
    
    <!-- Company -->
    <text x="185" y="28" class="mono" font-size="13" font-weight="800" fill="#f8fafc">EMBRAER (P3E)</text>
    
    <!-- Impact Metric -->
    <text x="14" y="56" class="mono" font-size="13.5" font-weight="800" fill="#00e5ff">
      ⚡ 350+ Operational Hours Saved / Month
    </text>
    <text x="14" y="76" class="sans" font-size="11.5" fill="#94a3b8">
      Architected enterprise process automation engines,
    </text>
    <text x="14" y="93" class="sans" font-size="11.5" fill="#94a3b8">
      modernizing operational workflows across business units.
    </text>
  </g>

  <!-- Bento 3: BOTTOM RIGHT (UFSCar & AWS) -->
  <g transform="translate(470, 172)">
    <rect width="418" height="105" rx="5" fill="#0e1526" stroke="#00e5ff" stroke-width="1.2" stroke-opacity="0.3" />
    <!-- Tag -->
    <rect x="14" y="12" width="170" height="22" rx="3" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-width="1" stroke-opacity="0.3" />
    <text x="99" y="27" class="mono" font-size="10.5" font-weight="800" fill="#cbd5e1" text-anchor="middle">CREDENTIALS &amp; CLOUD</text>
    
    <!-- Title -->
    <text x="195" y="28" class="mono" font-size="13" font-weight="800" fill="#f8fafc">UFSCAR + AWS</text>
    
    <!-- Degree & Cert -->
    <text x="14" y="56" class="mono" font-size="13" font-weight="800" fill="#f8fafc">
      B.S. in Computer Science — UFSCar
    </text>
    <text x="14" y="76" class="mono" font-size="12" font-weight="700" fill="#ffaa44">
      AWS Certified Cloud Practitioner (CLF-C02)
    </text>
    <text x="14" y="94" class="mono" font-size="11" fill="#00e5ff">
      Clean Architecture • Domain-Driven Design • SOLID
    </text>
  </g>

  <!-- Bottom Accent Line -->
  <path d="M 32 294 L 888 294" stroke="url(#orangeBarMission)" stroke-width="2.5" stroke-linecap="round" />
</svg>
