<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 56" width="100%" height="100%" fill="none">
  <defs>
    <pattern id="hudTelemHGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#00e5ff" stroke-width="0.75" stroke-opacity="0.06" />
    </pattern>

    <linearGradient id="hudTelemHGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b101d" />
      <stop offset="50%" stop-color="#070a12" />
      <stop offset="100%" stop-color="#0e1526" />
    </linearGradient>

    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace; }
      .beacon { animation: pulse 2s infinite ease-in-out; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    </style>
  </defs>

  <!-- Chassis -->
  <rect width="920" height="56" rx="6" fill="url(#hudTelemHGrad)" stroke="#00e5ff" stroke-width="1.3" stroke-opacity="0.3" />
  <rect x="2" y="2" width="916" height="52" rx="4" fill="url(#hudTelemHGrid)" />

  <!-- Corner Brackets -->
  <path d="M 8 20 L 8 8 L 20 8" fill="none" stroke="#00e5ff" stroke-width="2.5" stroke-linecap="square" />
  <path d="M 900 8 L 912 8 L 912 20" fill="none" stroke="#00e5ff" stroke-width="2.5" stroke-linecap="square" />
  <path d="M 8 36 L 8 48 L 20 48" fill="none" stroke="#00e5ff" stroke-width="2.5" stroke-linecap="square" />
  <path d="M 900 48 L 912 48 L 912 36" fill="none" stroke="#00e5ff" stroke-width="2.5" stroke-linecap="square" />

  <!-- Header Content -->
  <g transform="translate(28, 20)">
    <circle cx="5" cy="8" r="4.5" fill="#10b981" />
    <circle cx="5" cy="8" r="8" fill="#10b981" fill-opacity="0.25" class="beacon" />
    <text x="22" y="12" class="mono" font-size="14" font-weight="800" fill="#f8fafc" letter-spacing="0.08em">// 04. ROBOTIC TELEMETRY // LIVE PERFORMANCE GAUGES</text>
    <text x="864" y="12" class="mono" font-size="11.5" font-weight="700" text-anchor="end" fill="#00e5ff" letter-spacing="0.06em">STREAM: LIVE SYNC // GH.API: NOMINAL</text>
  </g>
</svg>
