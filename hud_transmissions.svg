<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 370" width="100%" height="100%" fill="none">
  <defs>
    <pattern id="hudTransGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#00e5ff" stroke-width="0.75" stroke-opacity="0.06" />
    </pattern>

    <linearGradient id="hudTransGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b101d" />
      <stop offset="50%" stop-color="#070a12" />
      <stop offset="100%" stop-color="#0e1526" />
    </linearGradient>

    <linearGradient id="orangeBarTransHalf" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6b00" stop-opacity="0" />
      <stop offset="30%" stop-color="#ff7700" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#ff7700" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ff6b00" stop-opacity="0" />
    </linearGradient>

    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .beacon { animation: pulse 2s infinite ease-in-out; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    </style>
  </defs>

  <!-- Chassis -->
  <rect width="440" height="370" rx="8" fill="url(#hudTransGrad)" stroke="#00e5ff" stroke-width="1.3" stroke-opacity="0.28" />
  <rect x="2" y="2" width="436" height="366" rx="6" fill="url(#hudTransGrid)" />

  <!-- Corner Brackets -->
  <path d="M 10 30 L 10 10 L 30 10" fill="none" stroke="#00e5ff" stroke-width="2.6" stroke-linecap="square" />
  <path d="M 410 10 L 430 10 L 430 30" fill="none" stroke="#00e5ff" stroke-width="2.6" stroke-linecap="square" />
  <path d="M 10 340 L 10 360 L 30 360" fill="none" stroke="#00e5ff" stroke-width="2.6" stroke-linecap="square" />
  <path d="M 410 360 L 430 360 L 430 340" fill="none" stroke="#00e5ff" stroke-width="2.6" stroke-linecap="square" />

  <!-- Header -->
  <g transform="translate(20, 30)">
    <circle cx="5" cy="5" r="4.5" fill="#ff7700" />
    <circle cx="5" cy="5" r="8" fill="#ff7700" fill-opacity="0.25" class="beacon" />
    <text x="20" y="9" class="mono" font-size="13" font-weight="800" fill="#f8fafc" letter-spacing="0.08em">// 03. INTEL &amp; TRANSMISSIONS</text>
    <text x="400" y="9" class="mono" font-size="10" font-weight="700" text-anchor="end" fill="#00e5ff">LOGS: 3 ACTIVE</text>
  </g>

  <line x1="20" y1="46" x2="420" y2="46" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.2" />

  <!-- Log 1: Spring vs Quarkus -->
  <g transform="translate(20, 58)">
    <rect width="400" height="74" rx="4" fill="#0e1526" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.3" />
    <rect x="12" y="10" width="115" height="17" rx="3" fill="#00e5ff" fill-opacity="0.14" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.6" />
    <text x="70" y="22" class="mono" font-size="8.5" font-weight="800" fill="#00e5ff" text-anchor="middle">BENCHMARK // COST</text>
    <text x="388" y="22" class="mono" font-size="9" font-weight="700" fill="#ff9933" text-anchor="end">TRANS-01 ↗</text>
    <text x="12" y="44" class="mono" font-size="13.5" font-weight="800" fill="#f8fafc">SPRING BOOT VS QUARKUS</text>
    <text x="12" y="62" class="sans" font-size="11" fill="#94a3b8">Processing cost, startup latency &amp; memory footprint</text>
  </g>

  <!-- Log 2: AWS Certified -->
  <g transform="translate(20, 140)">
    <rect width="400" height="74" rx="4" fill="#0e1526" stroke="#ff7700" stroke-width="1" stroke-opacity="0.3" />
    <rect x="12" y="10" width="115" height="17" rx="3" fill="#ff7700" fill-opacity="0.14" stroke="#ff7700" stroke-width="1" stroke-opacity="0.6" />
    <text x="70" y="22" class="mono" font-size="8.5" font-weight="800" fill="#ff9933" text-anchor="middle">CLOUD // AWS</text>
    <text x="388" y="22" class="mono" font-size="9" font-weight="700" fill="#00e5ff" text-anchor="end">TRANS-02 ↗</text>
    <text x="12" y="44" class="mono" font-size="13.5" font-weight="800" fill="#f8fafc">AWS PRACTITIONER JOURNEY</text>
    <text x="12" y="62" class="sans" font-size="11" fill="#94a3b8">Preparation methodology &amp; core cloud architecture</text>
  </g>

  <!-- Log 3: Odyssey -->
  <g transform="translate(20, 222)">
    <rect width="400" height="74" rx="4" fill="#0e1526" stroke="#ffffff" stroke-width="1" stroke-opacity="0.1" />
    <rect x="12" y="10" width="115" height="17" rx="3" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-width="1" stroke-opacity="0.25" />
    <text x="70" y="22" class="mono" font-size="8.5" font-weight="800" fill="#cbd5e1" text-anchor="middle">CAREER // ODYSSEY</text>
    <text x="388" y="22" class="mono" font-size="9" font-weight="700" fill="#cbd5e1" text-anchor="end">TRANS-03 ↗</text>
    <text x="12" y="44" class="mono" font-size="13.5" font-weight="800" fill="#f8fafc">UFSCAR → EMBRAER → ITAÚ</text>
    <text x="12" y="62" class="sans" font-size="11" fill="#94a3b8">Scaling software from aerospace to payment systems</text>
  </g>

  <!-- Station Link Footer -->
  <g transform="translate(20, 304)">
    <rect width="400" height="34" rx="4" fill="#152038" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.3" />
    <text x="200" y="21" class="mono" font-size="11" font-weight="700" fill="#00e5ff" text-anchor="middle" letter-spacing="0.05em">
      ACCESS TRANSMISSIONS FEED ON PORTFOLIO ↗
    </text>
  </g>

  <!-- Bottom Accent Line -->
  <path d="M 20 354 L 420 354" stroke="url(#orangeBarTransHalf)" stroke-width="2.5" stroke-linecap="round" />
</svg>
