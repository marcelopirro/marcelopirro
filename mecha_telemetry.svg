<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" width="100%" height="100%" fill="none">
  <defs>
    <pattern id="mechaGridV2" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#00e5ff" stroke-width="0.75" stroke-opacity="0.06" />
    </pattern>

    <linearGradient id="mechaGradV2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b101d" />
      <stop offset="50%" stop-color="#070a12" />
      <stop offset="100%" stop-color="#0e1526" />
    </linearGradient>

    <linearGradient id="cyanBarV2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0088cc" />
      <stop offset="100%" stop-color="#00e5ff" />
    </linearGradient>

    <linearGradient id="orangeBarV2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cc5500" />
      <stop offset="100%" stop-color="#ff7700" />
    </linearGradient>

    <linearGradient id="greenBarV2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#057a55" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="orangeBarTelemetryV2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6b00" stop-opacity="0" />
      <stop offset="30%" stop-color="#ff7700" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#ff7700" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ff6b00" stop-opacity="0" />
    </linearGradient>

    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .beacon { animation: pulse 2s infinite ease-in-out; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    </style>
  </defs>

  <!-- Chassis -->
  <rect width="920" height="280" rx="8" fill="url(#mechaGradV2)" stroke="#00e5ff" stroke-width="1.4" stroke-opacity="0.32" />
  <rect x="2" y="2" width="916" height="276" rx="6" fill="url(#mechaGridV2)" />

  <!-- Corner Brackets -->
  <path d="M 12 36 L 12 12 L 36 12" fill="none" stroke="#00e5ff" stroke-width="3" stroke-linecap="square" />
  <path d="M 884 12 L 908 12 L 908 36" fill="none" stroke="#00e5ff" stroke-width="3" stroke-linecap="square" />
  <path d="M 12 244 L 12 268 L 36 268" fill="none" stroke="#00e5ff" stroke-width="3" stroke-linecap="square" />
  <path d="M 884 268 L 908 268 L 908 244" fill="none" stroke="#00e5ff" stroke-width="3" stroke-linecap="square" />

  <!-- Header -->
  <g transform="translate(32, 34)">
    <circle cx="5" cy="5" r="4.5" fill="#10b981" />
    <circle cx="5" cy="5" r="8.5" fill="#10b981" fill-opacity="0.25" class="beacon" />
    <text x="22" y="9" class="mono" font-size="14.5" font-weight="800" fill="#f8fafc" letter-spacing="0.08em">// 04. MECHA DIAGNOSTIC &amp; ROBOTIC STATUS CORE</text>
    <text x="856" y="9" class="mono" font-size="12" font-weight="700" text-anchor="end" fill="#00e5ff">UNIT: MP-01 // REACTOR: 100% NOMINAL</text>
  </g>

  <line x1="32" y1="50" x2="888" y2="50" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.2" />

  <!-- Left: 4 Diagnostic Power Meters (High Contrast & Large Font) -->
  <!-- Meter 1: Commits -->
  <g transform="translate(32, 66)">
    <text x="0" y="13" class="mono" font-size="12" font-weight="800" fill="#00e5ff" letter-spacing="0.06em">01 // CODE INGESTION &amp; DISPATCH (COMMITS)</text>
    <text x="560" y="13" class="mono" font-size="12" font-weight="800" fill="#f8fafc" text-anchor="end">VELOCITY: HIGH [94%]</text>
    <rect x="0" y="21" width="560" height="15" rx="3" fill="#0e1526" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.35" />
    <rect x="2" y="23" width="526" height="11" rx="2" fill="url(#cyanBarV2)" />
    <circle cx="528" cy="28.5" r="3.5" fill="#ffffff" class="beacon" />
  </g>

  <!-- Meter 2: Pull Requests -->
  <g transform="translate(32, 114)">
    <text x="0" y="13" class="mono" font-size="12" font-weight="800" fill="#ff9933" letter-spacing="0.06em">02 // INTEGRATION &amp; REVIEW (PULL REQUESTS)</text>
    <text x="560" y="13" class="mono" font-size="12" font-weight="800" fill="#f8fafc" text-anchor="end">GATE: VERIFIED [88%]</text>
    <rect x="0" y="21" width="560" height="15" rx="3" fill="#0e1526" stroke="#ff7700" stroke-width="1" stroke-opacity="0.35" />
    <rect x="2" y="23" width="490" height="11" rx="2" fill="url(#orangeBarV2)" />
    <circle cx="492" cy="28.5" r="3.5" fill="#ffffff" class="beacon" />
  </g>

  <!-- Meter 3: SLA & Resilience -->
  <g transform="translate(32, 162)">
    <text x="0" y="13" class="mono" font-size="12" font-weight="800" fill="#10b981" letter-spacing="0.06em">03 // SLA RELIABILITY &amp; FAULT TOLERANCE</text>
    <text x="560" y="13" class="mono" font-size="12" font-weight="800" fill="#10b981" text-anchor="end">TARGET: 99.99% RESILIENCE [100%]</text>
    <rect x="0" y="21" width="560" height="15" rx="3" fill="#0e1526" stroke="#10b981" stroke-width="1" stroke-opacity="0.35" />
    <rect x="2" y="23" width="556" height="11" rx="2" fill="url(#greenBarV2)" />
    <circle cx="556" cy="28.5" r="3.5" fill="#ffffff" class="beacon" />
  </g>

  <!-- Meter 4: Clean Architecture -->
  <g transform="translate(32, 210)">
    <text x="0" y="13" class="mono" font-size="12" font-weight="800" fill="#cbd5e1" letter-spacing="0.06em">04 // ARCHITECTURE INTEGRITY (DDD &amp; CLEAN ARCH)</text>
    <text x="560" y="13" class="mono" font-size="12" font-weight="800" fill="#f8fafc" text-anchor="end">SPEC: ENTERPRISE [96%]</text>
    <rect x="0" y="21" width="560" height="15" rx="3" fill="#0e1526" stroke="#ffffff" stroke-width="1" stroke-opacity="0.2" />
    <rect x="2" y="23" width="538" height="11" rx="2" fill="url(#cyanBarV2)" />
    <circle cx="540" cy="28.5" r="3.5" fill="#ffffff" class="beacon" />
  </g>

  <!-- Right: Radar Reticle Display (Large & Clear) -->
  <g transform="translate(626, 66)">
    <rect width="262" height="182" rx="5" fill="#0e1526" stroke="#00e5ff" stroke-width="1.2" stroke-opacity="0.35" />
    
    <!-- Concentric Reticle Rings -->
    <circle cx="131" cy="74" r="54" stroke="#00e5ff" stroke-width="1.2" stroke-opacity="0.3" fill="none" />
    <circle cx="131" cy="74" r="36" stroke="#00e5ff" stroke-width="1.2" stroke-opacity="0.4" fill="none" />
    <circle cx="131" cy="74" r="18" stroke="#ff7700" stroke-width="1.2" stroke-opacity="0.6" fill="none" />
    
    <!-- Crosshairs -->
    <line x1="131" y1="16" x2="131" y2="132" stroke="#00e5ff" stroke-width="1.2" stroke-opacity="0.35" stroke-dasharray="3,3" />
    <line x1="73" y1="74" x2="189" y2="74" stroke="#00e5ff" stroke-width="1.2" stroke-opacity="0.35" stroke-dasharray="3,3" />
    
    <!-- Target Blips -->
    <circle cx="148" cy="58" r="4" fill="#10b981" class="beacon" />
    <circle cx="114" cy="90" r="3.5" fill="#ff7700" class="beacon" />
    <circle cx="156" cy="96" r="3" fill="#00e5ff" />

    <!-- Telemetry Readouts -->
    <text x="131" y="148" class="mono" font-size="11" font-weight="800" fill="#00e5ff" text-anchor="middle" letter-spacing="0.08em">
      RADAR: TELEMETRY LOCK
    </text>
    <text x="131" y="167" class="mono" font-size="10" font-weight="700" fill="#ff9933" text-anchor="middle">
      JVM ONLINE // KAFKA CONNECTED
    </text>
  </g>

  <!-- Bottom Accent Line -->
  <path d="M 32 264 L 888 264" stroke="url(#orangeBarTelemetryV2)" stroke-width="2.5" stroke-linecap="round" />
</svg>
