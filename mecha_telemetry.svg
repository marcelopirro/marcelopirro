<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 290" width="100%" height="100%" fill="none">
  <defs>
    <pattern id="mechaGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#00e5ff" stroke-width="0.75" stroke-opacity="0.06" />
    </pattern>

    <linearGradient id="mechaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b101d" />
      <stop offset="50%" stop-color="#070a12" />
      <stop offset="100%" stop-color="#0e1526" />
    </linearGradient>

    <linearGradient id="cyanBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#00e5ff" />
    </linearGradient>

    <linearGradient id="orangeBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff7700" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ff7700" />
    </linearGradient>

    <linearGradient id="greenBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="orangeBarTelemetry" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6b00" stop-opacity="0" />
      <stop offset="30%" stop-color="#ff7700" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#ff7700" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ff6b00" stop-opacity="0" />
    </linearGradient>

    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .beacon { animation: pulse 2s infinite ease-in-out; }
      .radar-sweep { transform-origin: 760px 155px; animation: sweep 6s infinite linear; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
      @keyframes sweep { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
  </defs>

  <!-- Chassis -->
  <rect width="920" height="290" rx="8" fill="url(#mechaGrad)" stroke="#00e5ff" stroke-width="1.3" stroke-opacity="0.3" />
  <rect x="2" y="2" width="916" height="286" rx="6" fill="url(#mechaGrid)" />

  <!-- Corner Brackets -->
  <path d="M 12 36 L 12 12 L 36 12" fill="none" stroke="#00e5ff" stroke-width="3" stroke-linecap="square" />
  <path d="M 884 12 L 908 12 L 908 36" fill="none" stroke="#00e5ff" stroke-width="3" stroke-linecap="square" />
  <path d="M 12 254 L 12 278 L 36 278" fill="none" stroke="#00e5ff" stroke-width="3" stroke-linecap="square" />
  <path d="M 884 278 L 908 278 L 908 254" fill="none" stroke="#00e5ff" stroke-width="3" stroke-linecap="square" />

  <!-- Header -->
  <g transform="translate(32, 34)">
    <circle cx="5" cy="5" r="4.5" fill="#10b981" />
    <circle cx="5" cy="8" r="8" fill="#10b981" fill-opacity="0.25" class="beacon" />
    <text x="22" y="9" class="mono" font-size="14" font-weight="800" fill="#f8fafc" letter-spacing="0.08em">// 04. MECHA DIAGNOSTIC &amp; TELEMETRY STATUS</text>
    <text x="856" y="9" class="mono" font-size="11.5" font-weight="700" text-anchor="end" fill="#00e5ff">UNIT: MP-01 // REACTOR: 100% NOMINAL</text>
  </g>

  <line x1="32" y1="52" x2="888" y2="52" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.2" />

  <!-- Left: Diagnostic Bars -->
  <!-- Bar 1: Commits -->
  <g transform="translate(32, 70)">
    <text x="0" y="11" class="mono" font-size="11" font-weight="700" fill="#00e5ff" letter-spacing="0.06em">01 // CODE INGESTION &amp; DISPATCH (COMMITS)</text>
    <text x="560" y="11" class="mono" font-size="11" font-weight="800" fill="#f8fafc" text-anchor="end">LEVEL: HIGH VELOCITY [94%]</text>
    <rect x="0" y="18" width="560" height="12" rx="2" fill="#0e1526" stroke="#00e5ff" stroke-width="0.8" stroke-opacity="0.3" />
    <rect x="2" y="20" width="526" height="8" rx="1.5" fill="url(#cyanBar)" />
    <!-- Indicator dot -->
    <circle cx="528" cy="24" r="3" fill="#00e5ff" class="beacon" />
  </g>

  <!-- Bar 2: Pull Requests -->
  <g transform="translate(32, 116)">
    <text x="0" y="11" class="mono" font-size="11" font-weight="700" fill="#ff9933" letter-spacing="0.06em">02 // INTEGRATION &amp; REVIEW (PULL REQUESTS)</text>
    <text x="560" y="11" class="mono" font-size="11" font-weight="800" fill="#f8fafc" text-anchor="end">GATE: VERIFIED &amp; MERGED [88%]</text>
    <rect x="0" y="18" width="560" height="12" rx="2" fill="#0e1526" stroke="#ff7700" stroke-width="0.8" stroke-opacity="0.3" />
    <rect x="2" y="20" width="490" height="8" rx="1.5" fill="url(#orangeBar)" />
    <circle cx="492" cy="24" r="3" fill="#ff7700" class="beacon" />
  </g>

  <!-- Bar 3: SLA & Resilience -->
  <g transform="translate(32, 162)">
    <text x="0" y="11" class="mono" font-size="11" font-weight="700" fill="#10b981" letter-spacing="0.06em">03 // SLA RELIABILITY &amp; FAULT TOLERANCE</text>
    <text x="560" y="11" class="mono" font-size="11" font-weight="800" fill="#10b981" text-anchor="end">TARGET: 99.99% RESILIENCE [100%]</text>
    <rect x="0" y="18" width="560" height="12" rx="2" fill="#0e1526" stroke="#10b981" stroke-width="0.8" stroke-opacity="0.3" />
    <rect x="2" y="20" width="556" height="8" rx="1.5" fill="url(#greenBar)" />
    <circle cx="556" cy="24" r="3" fill="#10b981" class="beacon" />
  </g>

  <!-- Bar 4: Anomaly Defense -->
  <g transform="translate(32, 208)">
    <text x="0" y="11" class="mono" font-size="11" font-weight="700" fill="#cbd5e1" letter-spacing="0.06em">04 // ANOMALY RESOLUTION &amp; PATCHING (ISSUES)</text>
    <text x="560" y="11" class="mono" font-size="11" font-weight="800" fill="#f8fafc" text-anchor="end">STATUS: ZERO-DOWNTIME [92%]</text>
    <rect x="0" y="18" width="560" height="12" rx="2" fill="#0e1526" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.15" />
    <rect x="2" y="20" width="515" height="8" rx="1.5" fill="url(#cyanBar)" />
    <circle cx="517" cy="24" r="3" fill="#00e5ff" class="beacon" />
  </g>

  <!-- Right: Radar Reticle Display -->
  <g transform="translate(630, 68)">
    <rect width="258" height="186" rx="4" fill="#0e1526" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.3" />
    
    <!-- Radar Circle Rings -->
    <circle cx="129" cy="85" r="62" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.25" fill="none" />
    <circle cx="129" cy="85" r="42" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.35" fill="none" />
    <circle cx="129" cy="85" r="22" stroke="#ff7700" stroke-width="1" stroke-opacity="0.45" fill="none" />
    
    <!-- Crosshairs -->
    <line x1="129" y1="18" x2="129" y2="152" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="3,3" />
    <line x1="62" y1="85" x2="196" y2="85" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="3,3" />
    
    <!-- Radar Target Blips -->
    <circle cx="148" cy="68" r="3.5" fill="#10b981" class="beacon" />
    <circle cx="112" cy="102" r="3" fill="#ff7700" class="beacon" />
    <circle cx="160" cy="115" r="2.5" fill="#00e5ff" />

    <!-- Reticle Labels -->
    <text x="129" y="162" class="mono" font-size="10" font-weight="700" fill="#00e5ff" text-anchor="middle" letter-spacing="0.08em">
      RADAR: TELEMETRY LOCK
    </text>
    <text x="129" y="177" class="mono" font-size="8.5" fill="#94a3b8" text-anchor="middle">
      SYS.FREQ // 142.85 MHZ NOMINAL
    </text>
  </g>

  <!-- Bottom Accent Line -->
  <path d="M 32 272 L 888 272" stroke="url(#orangeBarTelemetry)" stroke-width="2.5" stroke-linecap="round" />
</svg>
