<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 370" width="100%" height="100%" fill="none">
  <defs>
    <pattern id="tacticalGridAbout" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#00e5ff" stroke-width="0.75" stroke-opacity="0.06" />
    </pattern>

    <linearGradient id="aboutGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b101d" />
      <stop offset="50%" stop-color="#070a12" />
      <stop offset="100%" stop-color="#0e1526" />
    </linearGradient>

    <linearGradient id="orangeBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6b00" stop-opacity="0" />
      <stop offset="25%" stop-color="#ff7700" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#ff7700" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ff6b00" stop-opacity="0" />
    </linearGradient>

    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .beacon { animation: pulse 2s infinite ease-in-out; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    </style>
  </defs>

  <!-- Base Chassis -->
  <rect width="920" height="370" rx="8" fill="url(#aboutGrad)" stroke="#00e5ff" stroke-width="1.2" stroke-opacity="0.25" />
  <rect x="2" y="2" width="916" height="366" rx="6" fill="url(#tacticalGridAbout)" />

  <!-- Mecha Corner Brackets -->
  <path d="M 12 36 L 12 12 L 36 12" fill="none" stroke="#00e5ff" stroke-width="2.8" stroke-linecap="square" />
  <path d="M 884 12 L 908 12 L 908 36" fill="none" stroke="#00e5ff" stroke-width="2.8" stroke-linecap="square" />
  <path d="M 12 334 L 12 358 L 36 358" fill="none" stroke="#00e5ff" stroke-width="2.8" stroke-linecap="square" />
  <path d="M 884 358 L 908 358 L 908 334" fill="none" stroke="#00e5ff" stroke-width="2.8" stroke-linecap="square" />

  <!-- Section Header Bar -->
  <g transform="translate(32, 34)">
    <circle cx="5" cy="5" r="4.5" fill="#ff7700" />
