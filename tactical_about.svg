    <text x="22" y="9" class="mono" font-size="13" font-weight="700" fill="#f8fafc" letter-spacing="0.08em">// 01. OPERATIONAL BACKGROUND &amp; SPECIFICATION</text>
    <text x="856" y="9" class="mono" font-size="11" text-anchor="end" fill="#00e5ff" letter-spacing="0.06em">LOC: SÃO PAULO, BR // STATUS: ACTIVE</text>
  </g>

