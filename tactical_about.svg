    </text>
  </g>

  <!-- Architecture Practices Tags Row -->
  <g transform="translate(32, 298)">
    <rect width="856" height="38" rx="4" fill="#152038" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.25" />
    <text x="16" y="23" class="mono" font-size="11" font-weight="700" fill="#00e5ff">CORE PRINCIPLES:</text>
    
    <text x="160" y="23" class="mono" font-size="11" fill="#cbd5e1">CLEAN ARCHITECTURE</text>
    <text x="315" y="23" class="mono" font-size="11" fill="#475569">•</text>
    <text x="335" y="23" class="mono" font-size="11" fill="#cbd5e1">DOMAIN-DRIVEN DESIGN</text>
    <text x="500" y="23" class="mono" font-size="11" fill="#475569">•</text>
    <text x="520" y="23" class="mono" font-size="11" fill="#cbd5e1">EVENT-DRIVEN (EDA)</text>
    <text x="665" y="23" class="mono" font-size="11" fill="#475569">•</text>
    <text x="685" y="23" class="mono" font-size="11" fill="#cbd5e1">SOLID &amp; TDD</text>
    <text x="785" y="23" class="mono" font-size="11" fill="#475569">•</text>
    <text x="800" y="23" class="mono" font-size="11" font-weight="600" fill="#ff9933">FAULT TOLERANCE</text>
  </g>

  <!-- Bottom Accent Line -->
  <path d="M 32 350 L 888 350" stroke="url(#orangeBar)" stroke-width="2.5" stroke-linecap="round" />
