  <line x1="32" y1="52" x2="888" y2="52" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.2" />

  <!-- Mission Card 1: Conexão Tech / Itaú -->
  <g transform="translate(32, 68)">
    <rect width="856" height="66" rx="4" fill="#0e1526" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.3" />
    <!-- Tag -->
    <rect x="14" y="12" width="138" height="20" rx="3" fill="#00e5ff" fill-opacity="0.12" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.6" />
    <text x="83" y="26" class="mono" font-size="9" font-weight="700" fill="#00e5ff" text-anchor="middle">CURRENT OPERATIONS</text>
    <!-- Role & Company -->
    <text x="164" y="27" class="mono" font-size="13" font-weight="700" fill="#f8fafc">CONEXÃO TECH (ITAÚ GROUP) // BACKEND SOFTWARE ENGINEER</text>
    <!-- Description -->
    <text x="16" y="50" class="sans" font-size="12" fill="#94a3b8">
      Architecting high-availability, mission-critical payment processing engines and distributed financial microservices using Java, Spring Boot, and Kafka under stringent SLA and security demands.
    </text>
  </g>

