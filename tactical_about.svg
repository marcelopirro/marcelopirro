    </text>
  </g>

  <!-- Mission Card 3: UFSCar & AWS -->
  <g transform="translate(32, 220)">
    <rect width="856" height="66" rx="4" fill="#0e1526" stroke="#ffffff" stroke-width="1" stroke-opacity="0.08" />
