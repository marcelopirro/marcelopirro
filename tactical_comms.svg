<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 180" width="100%" height="100%" fill="none">
  <defs>
    <pattern id="tacticalGridComms" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#00e5ff" stroke-width="0.75" stroke-opacity="0.06" />
    </pattern>

    <linearGradient id="commsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b101d" />
      <stop offset="50%" stop-color="#070a12" />
      <stop offset="100%" stop-color="#0e1526" />
    </linearGradient>

    <linearGradient id="orangeBarComms" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6b00" stop-opacity="0" />
      <stop offset="25%" stop-color="#ff7700" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#ff7700" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ff6b00" stop-opacity="0" />
    </linearGradient>

    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .beacon { animation: pulse 2s infinite ease-in-out; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    </style>
  </defs>

  <!-- Base Chassis -->
  <rect width="920" height="180" rx="8" fill="url(#commsGrad)" stroke="#00e5ff" stroke-width="1.2" stroke-opacity="0.25" />
  <rect x="2" y="2" width="916" height="176" rx="6" fill="url(#tacticalGridComms)" />

  <!-- Mecha Corner Brackets -->
  <path d="M 12 32 L 12 12 L 32 12" fill="none" stroke="#00e5ff" stroke-width="2.8" stroke-linecap="square" />
  <path d="M 888 12 L 908 12 L 908 32" fill="none" stroke="#00e5ff" stroke-width="2.8" stroke-linecap="square" />
  <path d="M 12 148 L 12 168 L 32 168" fill="none" stroke="#00e5ff" stroke-width="2.8" stroke-linecap="square" />
  <path d="M 888 168 L 908 168 L 908 148" fill="none" stroke="#00e5ff" stroke-width="2.8" stroke-linecap="square" />

  <!-- Section Header Bar -->
  <g transform="translate(32, 32)">
    <circle cx="5" cy="5" r="4.5" fill="#10b981" />
    <circle cx="5" cy="5" r="8" fill="#10b981" fill-opacity="0.25" class="beacon" />
    <text x="22" y="9" class="mono" font-size="13" font-weight="700" fill="#f8fafc" letter-spacing="0.08em">// 04. SECURE TRANSMISSION FREQUENCY</text>
    <text x="856" y="9" class="mono" font-size="11" text-anchor="end" fill="#10b981" letter-spacing="0.06em">FREQUENCY OPEN // ACTIVE</text>
  </g>

  <!-- Divider -->
  <line x1="32" y1="48" x2="888" y2="48" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.2" />

  <!-- 3 Communication Channels -->
  <!-- Channel 1: Portfolio -->
  <g transform="translate(32, 64)">
    <rect width="272" height="66" rx="4" fill="#0e1526" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.3" />
    <text x="14" y="24" class="mono" font-size="10" font-weight="700" fill="#00e5ff" letter-spacing="0.06em">TACTICAL PORTFOLIO</text>
    <text x="14" y="47" class="mono" font-size="11.5" font-weight="600" fill="#f8fafc">marcelopirro.vercel.app</text>
  </g>

  <!-- Channel 2: LinkedIn -->
  <g transform="translate(324, 64)">
    <rect width="272" height="66" rx="4" fill="#0e1526" stroke="#ff7700" stroke-width="1" stroke-opacity="0.35" />
    <text x="14" y="24" class="mono" font-size="10" font-weight="700" fill="#ff9933" letter-spacing="0.06em">LINKEDIN DISPATCH</text>
    <text x="14" y="47" class="mono" font-size="11.5" font-weight="600" fill="#f8fafc">/in/marcelopirro</text>
  </g>

  <!-- Channel 3: Email -->
  <g transform="translate(616, 64)">
    <rect width="272" height="66" rx="4" fill="#0e1526" stroke="#ffffff" stroke-width="1" stroke-opacity="0.1" />
    <text x="14" y="24" class="mono" font-size="10" font-weight="700" fill="#cbd5e1" letter-spacing="0.06em">DIRECT COMMS</text>
    <text x="14" y="47" class="mono" font-size="11.5" font-weight="600" fill="#f8fafc">marcelopirro@outlook.com</text>
  </g>

  <!-- Bottom Accent Line -->
  <path d="M 32 152 L 888 152" stroke="url(#orangeBarComms)" stroke-width="2.5" stroke-linecap="round" />
  
  <text x="460" y="166" text-anchor="middle" class="mono" font-size="8.5" fill="#475569">
    TRANSMISSION SECURE // ANAHEIM TACTICAL PROTOCOL // ALL SYSTEMS NOMINAL
  </text>
</svg>
