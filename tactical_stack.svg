<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 370" width="100%" height="100%" fill="none">
  <defs>
    <pattern id="tacticalGridStack" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#00e5ff" stroke-width="0.75" stroke-opacity="0.06" />
    </pattern>

    <linearGradient id="stackGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b101d" />
      <stop offset="50%" stop-color="#070a12" />
      <stop offset="100%" stop-color="#0e1526" />
    </linearGradient>

    <linearGradient id="orangeBarStack" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6b00" stop-opacity="0" />
      <stop offset="25%" stop-color="#ff7700" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#ff7700" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ff6b00" stop-opacity="0" />
    </linearGradient>

    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .badge-title { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; }
      .stack-title { font-size: 11px; font-weight: 700; fill: #00e5ff; letter-spacing: 0.06em; }
      .stack-tech { font-size: 12px; fill: #f8fafc; font-weight: 600; }
      .stack-sub { font-size: 11px; fill: #94a3b8; }
      .beacon { animation: pulse 2s infinite ease-in-out; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    </style>
  </defs>

  <!-- Base Chassis -->
  <rect width="920" height="370" rx="8" fill="url(#stackGrad)" stroke="#00e5ff" stroke-width="1.2" stroke-opacity="0.25" />
  <rect x="2" y="2" width="916" height="366" rx="6" fill="url(#tacticalGridStack)" />

  <!-- Mecha Corner Brackets -->
  <path d="M 12 36 L 12 12 L 36 12" fill="none" stroke="#00e5ff" stroke-width="2.8" stroke-linecap="square" />
  <path d="M 884 12 L 908 12 L 908 36" fill="none" stroke="#00e5ff" stroke-width="2.8" stroke-linecap="square" />
  <path d="M 12 334 L 12 358 L 36 358" fill="none" stroke="#00e5ff" stroke-width="2.8" stroke-linecap="square" />
  <path d="M 884 358 L 908 358 L 908 334" fill="none" stroke="#00e5ff" stroke-width="2.8" stroke-linecap="square" />

  <!-- Section Header Bar -->
  <g transform="translate(32, 34)">
    <circle cx="5" cy="5" r="4.5" fill="#00e5ff" />
    <circle cx="5" cy="5" r="8" fill="#00e5ff" fill-opacity="0.25" class="beacon" />
    <text x="22" y="9" class="mono" font-size="13" font-weight="700" fill="#f8fafc" letter-spacing="0.08em">// 02. TECHNICAL ARSENAL &amp; RADAR SPECIFICATION</text>
    <text x="856" y="9" class="mono" font-size="11" text-anchor="end" fill="#ff9933" letter-spacing="0.06em">RUNTIME: JVM / DISTRIBUTED CLOUD</text>
  </g>

  <!-- Divider -->
  <line x1="32" y1="52" x2="888" y2="52" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.2" />

  <!-- Row 1: Left Card (Languages) -->
  <g transform="translate(32, 68)">
    <rect width="418" height="80" rx="4" fill="#0e1526" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.25" />
    <text x="14" y="24" class="mono stack-title">// PROGRAMMING LANGUAGES</text>
    <text x="14" y="46" class="mono stack-tech">Java (17 / 21) • Python • TypeScript</text>
    <text x="14" y="65" class="mono stack-sub">JavaScript (ES6+) • SQL • C</text>
  </g>

  <!-- Row 1: Right Card (Frameworks) -->
  <g transform="translate(470, 68)">
    <rect width="418" height="80" rx="4" fill="#0e1526" stroke="#ff7700" stroke-width="1" stroke-opacity="0.3" />
    <text x="14" y="24" class="mono" font-size="11" font-weight="700" fill="#ff9933" letter-spacing="0.06em">// BACKEND &amp; ENTERPRISE FRAMEWORKS</text>
    <text x="14" y="46" class="mono stack-tech">Spring Boot • Quarkus • Hibernate / JPA</text>
    <text x="14" y="65" class="mono stack-sub">Spring Security • JDBC • REST &amp; SOAP APIs</text>
  </g>

  <!-- Row 2: Left Card (Messaging & Event-Driven) -->
  <g transform="translate(32, 158)">
    <rect width="418" height="80" rx="4" fill="#0e1526" stroke="#ffffff" stroke-width="1" stroke-opacity="0.08" />
    <text x="14" y="24" class="mono stack-title">// MESSAGING &amp; EVENT-DRIVEN STREAMING</text>
    <text x="14" y="46" class="mono stack-tech">Apache Kafka • RabbitMQ</text>
    <text x="14" y="65" class="mono stack-sub">Event-Driven Architecture • Async Processing &amp; Queues</text>
  </g>

  <!-- Row 2: Right Card (Databases) -->
  <g transform="translate(470, 158)">
    <rect width="418" height="80" rx="4" fill="#0e1526" stroke="#ffffff" stroke-width="1" stroke-opacity="0.08" />
    <text x="14" y="24" class="mono stack-title">// DATA PERSISTENCE &amp; STORAGE</text>
    <text x="14" y="46" class="mono stack-tech">PostgreSQL • Oracle Database • MySQL</text>
    <text x="14" y="65" class="mono stack-sub">MongoDB • Redis (Caching &amp; In-Memory Data)</text>
  </g>

  <!-- Row 3: Left Card (Cloud & DevOps) -->
  <g transform="translate(32, 248)">
    <rect width="418" height="80" rx="4" fill="#0e1526" stroke="#ff7700" stroke-width="1" stroke-opacity="0.25" />
    <text x="14" y="24" class="mono" font-size="11" font-weight="700" fill="#ff9933" letter-spacing="0.06em">// CLOUD &amp; DEVOPS INFRASTRUCTURE</text>
    <text x="14" y="46" class="mono stack-tech">AWS (Certified Practitioner) • Docker</text>
    <text x="14" y="65" class="mono stack-sub">Kubernetes • GitHub Actions CI/CD • Linux / Bash</text>
  </g>

  <!-- Row 3: Right Card (Testing & Methodologies) -->
  <g transform="translate(470, 248)">
    <rect width="418" height="80" rx="4" fill="#0e1526" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.25" />
    <text x="14" y="24" class="mono stack-title">// TESTING, ARCHITECTURE &amp; METHODOLOGY</text>
    <text x="14" y="46" class="mono stack-tech">JUnit 5 • Mockito • Test-Driven Dev (TDD)</text>
    <text x="14" y="65" class="mono stack-sub">Clean Architecture • DDD • SOLID • Agile / Scrum</text>
  </g>

  <!-- Bottom Accent Line -->
  <path d="M 32 346 L 888 346" stroke="url(#orangeBarStack)" stroke-width="2.5" stroke-linecap="round" />
</svg>
