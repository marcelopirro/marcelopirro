<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 290" width="100%" height="100%" fill="none">
  <defs>
    <pattern id="tacticalGridTrans" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#00e5ff" stroke-width="0.75" stroke-opacity="0.06" />
    </pattern>

    <linearGradient id="transGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b101d" />
      <stop offset="50%" stop-color="#070a12" />
      <stop offset="100%" stop-color="#0e1526" />
    </linearGradient>

    <linearGradient id="orangeBarTrans" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6b00" stop-opacity="0" />
      <stop offset="25%" stop-color="#ff7700" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#ff7700" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ff6b00" stop-opacity="0" />
    </linearGradient>

    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .beacon { animation: pulse 2s infinite ease-in-out; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    </style>
  </defs>

  <!-- Base Chassis -->
  <rect width="920" height="290" rx="8" fill="url(#transGrad)" stroke="#00e5ff" stroke-width="1.2" stroke-opacity="0.25" />
  <rect x="2" y="2" width="916" height="286" rx="6" fill="url(#tacticalGridTrans)" />

  <!-- Mecha Corner Brackets -->
  <path d="M 12 36 L 12 12 L 36 12" fill="none" stroke="#00e5ff" stroke-width="2.8" stroke-linecap="square" />
  <path d="M 884 12 L 908 12 L 908 36" fill="none" stroke="#00e5ff" stroke-width="2.8" stroke-linecap="square" />
  <path d="M 12 254 L 12 278 L 36 278" fill="none" stroke="#00e5ff" stroke-width="2.8" stroke-linecap="square" />
  <path d="M 884 278 L 908 278 L 908 254" fill="none" stroke="#00e5ff" stroke-width="2.8" stroke-linecap="square" />

  <!-- Section Header Bar -->
  <g transform="translate(32, 34)">
    <circle cx="5" cy="5" r="4.5" fill="#ff7700" />
    <circle cx="5" cy="5" r="8" fill="#ff7700" fill-opacity="0.25" class="beacon" />
    <text x="22" y="9" class="mono" font-size="13" font-weight="700" fill="#f8fafc" letter-spacing="0.08em">// 03. FEATURED TRANSMISSIONS &amp; BENCHMARKS</text>
    <text x="856" y="9" class="mono" font-size="11" text-anchor="end" fill="#00e5ff" letter-spacing="0.06em">FREQUENCY: MARCELOPIRRO.VERCEL.APP</text>
  </g>

  <!-- Divider -->
  <line x1="32" y1="52" x2="888" y2="52" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.2" />

  <!-- Article 1: Spring Boot vs Quarkus -->
  <g transform="translate(32, 68)">
    <rect width="856" height="56" rx="4" fill="#0e1526" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.25" />
    <rect x="12" y="10" width="105" height="18" rx="3" fill="#00e5ff" fill-opacity="0.12" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.5" />
    <text x="64" y="23" class="mono" font-size="8.5" font-weight="700" fill="#00e5ff" text-anchor="middle">BENCHMARK // COST</text>
    <text x="130" y="24" class="mono" font-size="12" font-weight="700" fill="#f8fafc">SPRING BOOT VS QUARKUS // PROCESSING COST &amp; LATENCY BENCHMARK</text>
    <text x="12" y="44" class="sans" font-size="11" fill="#94a3b8">Comprehensive benchmark evaluating memory footprint, container startup latency, and cloud infrastructure cost on AWS.</text>
    <text x="844" y="24" class="mono" font-size="10" font-weight="700" fill="#ff9933" text-anchor="end">TRANS-01 // v1.2</text>
  </g>

  <!-- Article 2: AWS Certified -->
  <g transform="translate(32, 134)">
    <rect width="856" height="56" rx="4" fill="#0e1526" stroke="#ff7700" stroke-width="1" stroke-opacity="0.25" />
    <rect x="12" y="10" width="105" height="18" rx="3" fill="#ff7700" fill-opacity="0.12" stroke="#ff7700" stroke-width="1" stroke-opacity="0.5" />
    <text x="64" y="23" class="mono" font-size="8.5" font-weight="700" fill="#ff9933" text-anchor="middle">CLOUD // AWS</text>
    <text x="130" y="24" class="mono" font-size="12" font-weight="700" fill="#f8fafc">AWS CERTIFIED CLOUD PRACTITIONER // ARCHITECTURAL DISPATCH</text>
    <text x="12" y="44" class="sans" font-size="11" fill="#94a3b8">Preparation methodology, Well-Architected Framework pillars, resilience models, and enterprise security fundamentals.</text>
    <text x="844" y="24" class="mono" font-size="10" font-weight="700" fill="#00e5ff" text-anchor="end">TRANS-02 // v1.1</text>
  </g>

  <!-- Article 3: UFSCar to Embraer to Itaú -->
  <g transform="translate(32, 200)">
    <rect width="856" height="56" rx="4" fill="#0e1526" stroke="#ffffff" stroke-width="1" stroke-opacity="0.08" />
    <rect x="12" y="10" width="105" height="18" rx="3" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-width="1" stroke-opacity="0.2" />
    <text x="64" y="23" class="mono" font-size="8.5" font-weight="700" fill="#cbd5e1" text-anchor="middle">CAREER // ODYSSEY</text>
    <text x="130" y="24" class="mono" font-size="12" font-weight="700" fill="#f8fafc">ENGINEERING ODYSSEY // UFSCAR → EMBRAER → CONEXÃO TECH</text>
    <text x="12" y="44" class="sans" font-size="11" fill="#94a3b8">Reflections on scaling software architecture from university foundations to aerospace automation and financial systems.</text>
    <text x="844" y="24" class="mono" font-size="10" font-weight="700" fill="#cbd5e1" text-anchor="end">TRANS-03 // v1.0</text>
  </g>

  <!-- Bottom Accent Line -->
  <path d="M 32 270 L 888 270" stroke="url(#orangeBarTrans)" stroke-width="2.5" stroke-linecap="round" />
</svg>
